name: Build unsigned Aegis27 and CanaryBox IPAs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select newest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort | tail -1)"
          test -n "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE_APP/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Validate research guardrails
        run: ./scripts/validate_repo.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build both device applications without signing
        shell: bash
        run: |
          set -euo pipefail
          for scheme in Aegis27 CanaryBox; do
            xcodebuild \
              -project Aegis27.xcodeproj \
              -scheme "$scheme" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY='' \
              AEGIS_SOURCE_REVISION="$GITHUB_SHA" \
              build
          done

      - name: Verify and package both unsigned IPAs
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="build/DerivedData/Build/Products/Release-iphoneos"
          AEGIS_APP="$PRODUCTS/Aegis27.app"
          CANARY_APP="$PRODUCTS/CanaryBox.app"
          test -d "$AEGIS_APP"
          test -d "$CANARY_APP"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$AEGIS_APP/Info.plist")" = "com.nightvibes33.Aegis27.v08"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$CANARY_APP/Info.plist")" = "com.nightvibes33.CanaryBox"
          test ! -e "$AEGIS_APP/embedded.mobileprovision"
          test ! -e "$CANARY_APP/embedded.mobileprovision"

          rm -rf build/package
          mkdir -p build/package/aegis/Payload build/package/canary/Payload build/artifacts
          cp -R "$AEGIS_APP" build/package/aegis/Payload/
          cp -R "$CANARY_APP" build/package/canary/Payload/

          (
            cd build/package/aegis
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ../../artifacts/Aegis27-unsigned.ipa
          )
          (
            cd build/package/canary
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ../../artifacts/CanaryBox-unsigned.ipa
          )
          cd build/artifacts
          /usr/bin/shasum -a 256 Aegis27-unsigned.ipa > Aegis27-unsigned.ipa.sha256
          /usr/bin/shasum -a 256 CanaryBox-unsigned.ipa > CanaryBox-unsigned.ipa.sha256

      - name: Upload both unsigned IPAs
        uses: actions/upload-artifact@v4
        with:
          name: Aegis27-CanaryBox-unsigned-${{ github.sha }}
          path: |
            build/artifacts/Aegis27-unsigned.ipa
            build/artifacts/Aegis27-unsigned.ipa.sha256
            build/artifacts/CanaryBox-unsigned.ipa
            build/artifacts/CanaryBox-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
