name: Aegis27
options:
  bundleIdPrefix: com.nightvibes33
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Aegis27:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: ViewModels
      - path: Views
    resources:
      - path: Resources/FirmwareCatalogs
    dependencies:
      - sdk: Security.framework
      - sdk: libsqlite3.tbd
      - target: AegisBoundaryShare
        embed: true
    entitlements:
      path: Resources/Aegis27.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.Aegis27.v08
        PRODUCT_NAME: Aegis27
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Services/ResearchBridge.h
        CURRENT_PROJECT_VERSION: 18
        MARKETING_VERSION: 0.19.0
        AEGIS_SOURCE_REVISION: local
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      gatherCoverageData: false
  CanaryBox:
    type: application
    platform: iOS
    sources:
      - path: CanaryBox
        excludes:
          - Info.plist
    dependencies:
      - sdk: Security.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.CanaryBox
        PRODUCT_NAME: CanaryBox
        INFOPLIST_FILE: CanaryBox/Info.plist
        CURRENT_PROJECT_VERSION: 18
        MARKETING_VERSION: 0.19.0
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      gatherCoverageData: false
  AegisBoundaryShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AegisShareExtension
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.Aegis27.v08.BoundaryShare
        PRODUCT_NAME: AegisBoundaryShare
        INFOPLIST_FILE: AegisShareExtension/Info.plist
        CURRENT_PROJECT_VERSION: 18
        MARKETING_VERSION: 0.19.0
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
